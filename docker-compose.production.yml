services:
  api:
    image: ghcr.io/technetechtt-dotcom/dripless-carwash/api:${IMAGE_TAG:-production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PORT: "4000"
      PROCESS_ROLE: api
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CUSTOMER_APP_URL},${DRIVER_APP_URL},${OPS_APP_URL}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL}
      DRIVER_APP_URL: ${DRIVER_APP_URL}
      OPS_APP_URL: ${OPS_APP_URL}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      PAYMENTS_PROVIDER: paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MFA_ENC_KEY: ${MFA_ENC_KEY}
      COMPLETION_PIN_PEPPER: ${COMPLETION_PIN_PEPPER}
      MFA_REQUIRED_OPS: "true"
      REQUIRE_SMS_DELIVERY: "${REQUIRE_SMS_DELIVERY:-false}"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-af-south-1}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-Dripless <noreply@dripless.co.za>}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
      SENTRY_DSN: ${SENTRY_DSN}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      VAT_RATE_BPS: "${VAT_RATE_BPS:-0}"
      VAT_NUMBER: "${VAT_NUMBER:-}"
      MALWARE_SCAN_URL: ${MALWARE_SCAN_URL}
      BCRYPT_COST: "12"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/technetechtt-dotcom/dripless-carwash/api:${IMAGE_TAG:-production}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PROCESS_ROLE: worker
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PAYMENTS_PROVIDER: paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-af-south-1}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-Dripless <noreply@dripless.co.za>}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON}
      SENTRY_DSN: ${SENTRY_DSN}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MALWARE_SCAN_URL: ${MALWARE_SCAN_URL}

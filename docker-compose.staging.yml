services:
  api:
    image: ghcr.io/technetechtt-dotcom/dripless-carwash/api:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PORT: "4000"
      PROCESS_ROLE: api
      DATABASE_URL: ${STAGING_DATABASE_URL}
      REDIS_URL: ${STAGING_REDIS_URL}
      CORS_ORIGINS: ${STAGING_CUSTOMER_URL},${STAGING_DRIVER_URL},${STAGING_OPS_URL}
      CUSTOMER_APP_URL: ${STAGING_CUSTOMER_URL}
      DRIVER_APP_URL: ${STAGING_DRIVER_URL}
      OPS_APP_URL: ${STAGING_OPS_URL}
      WEBAUTHN_RP_ID: ${STAGING_WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${STAGING_WEBAUTHN_ORIGIN}
      PAYMENTS_PROVIDER: paystack
      PAYSTACK_SECRET_KEY: ${STAGING_PAYSTACK_SK}
      PAYSTACK_PUBLIC_KEY: ${STAGING_PAYSTACK_PK}
      PAYSTACK_CALLBACK_URL: ${STAGING_PAYSTACK_CALLBACK_URL}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-none}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-none}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MFA_ENC_KEY: ${STAGING_MFA_ENC_KEY}
      COMPLETION_PIN_PEPPER: ${STAGING_COMPLETION_PIN_PEPPER}
      MFA_REQUIRED_OPS: "true"
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${STAGING_S3_BUCKET}
      S3_ACCESS_KEY: ${STAGING_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${STAGING_S3_SECRET_KEY}
      S3_ENDPOINT: ${STAGING_S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-af-south-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "Dripless Staging <noreply@staging.dripless.co.za>"
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      SENTRY_DSN: ${STAGING_SENTRY_DSN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      VAT_RATE_BPS: "${VAT_RATE_BPS:-0}"
      VAT_NUMBER: "${VAT_NUMBER:-}"
      MALWARE_SCAN_URL: ${MALWARE_SCAN_URL:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/technetechtt-dotcom/dripless-carwash/api:staging
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PROCESS_ROLE: worker
      DATABASE_URL: ${STAGING_DATABASE_URL}
      REDIS_URL: ${STAGING_REDIS_URL}
      PAYMENTS_PROVIDER: paystack
      PAYSTACK_SECRET_KEY: ${STAGING_PAYSTACK_SK}
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: ${STAGING_S3_BUCKET}
      S3_ACCESS_KEY: ${STAGING_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${STAGING_S3_SECRET_KEY}
      S3_ENDPOINT: ${STAGING_S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-af-south-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "Dripless Staging <noreply@staging.dripless.co.za>"
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      SENTRY_DSN: ${STAGING_SENTRY_DSN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  release:
    name: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: technetechtt-dotcom/dripless-carwash/api
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Dripless Customer/package-lock.json
            Dripless Driver/package-lock.json
            Dripless Ops Admin/package-lock.json

      - name: Build customer web artifact
        working-directory: Dripless Customer
        run: npm ci && npm run build
      - name: Build driver web artifact
        working-directory: Dripless Driver
        run: npm ci && npm run build
      - name: Build Ops web artifact
        working-directory: Dripless Ops Admin
        run: npm ci && npm run build
      - name: Package immutable web artifacts
        run: tar -czf dripless-web-${{ github.sha }}.tgz "Dripless Customer/dist" "Dripless Driver/dist" "Dripless Ops Admin/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dripless-web-${{ github.sha }}
          path: dripless-web-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 30

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable backend image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend-api
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_ENV }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Trigger deployment platform
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not configured for ${DEPLOY_ENV}; image and artifacts were published, skipping remote deploy trigger."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "{\"environment\":\"${DEPLOY_ENV}\",\"image\":\"${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}\",\"commit\":\"${GITHUB_SHA}\"}" \
            "$DEPLOY_WEBHOOK_URL"

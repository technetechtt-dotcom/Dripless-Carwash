name: Dripless CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  platform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Navigation integrity
        run: npm run check:navigation

  app-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Dripless Customer
          - Dripless Driver
          - Dripless Ops Admin
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dripless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DEMO_MODE: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dripless_test
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_COST: '10'
      ACCESS_TOKEN_TTL_MINUTES: '15'
      REFRESH_TOKEN_TTL_DAYS: '7'
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify migration history matches schema
        run: npx prisma migrate status

      - name: Check for pending migrations (schema drift)
        run: |
          output=$(npx prisma migrate status 2>&1)
          if echo "$output" | grep -q "Following migration.*not yet applied\|schema drift\|drift detected"; then
            echo "ERROR: Schema drift detected. Run 'prisma migrate dev' locally." >&2
            exit 1
          fi
          echo "Migration status: clean"

  golden-path:
    name: golden-path
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dripless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DEMO_MODE: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dripless_test
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_COST: '10'
      ACCESS_TOKEN_TTL_MINUTES: '15'
      REFRESH_TOKEN_TTL_DAYS: '7'
      REDIS_URL: redis://localhost:6379
      OZOW_PRIVATE_KEY: test-ozow-private-key
      OZOW_SITE_CODE: TST-SITE
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npm run prisma:generate

      - name: Golden path + GPS realtime tests
        working-directory: .
        run: npm run test:golden

  release-engineering:
    name: release-engineering
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dripless_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DEMO_MODE: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dripless_release
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_COST: '10'
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        working-directory: backend-api
        run: npm ci

      - name: Prisma migrate + generate
        working-directory: backend-api
        run: |
          npx prisma migrate deploy
          npm run prisma:generate

      - name: Release engineering tests
        working-directory: .
        run: |
          npm run test:golden
          npm run test:release
          npm run test:ozow-failures

      - name: Load smoke
        working-directory: .
        run: |
          npm --prefix backend-api ci
          npx tsx backend-api/src/index.ts > /tmp/api.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "API failed to start for load smoke" >&2
            cat /tmp/api.log >&2
            exit 1
          fi
          E2E_API_URL=http://127.0.0.1:4000 node tools/pilot/load-smoke.mjs

  e2e-cross-platform:
    name: e2e-cross-platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dripless_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DEMO_MODE: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dripless_e2e
      CORS_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174,http://127.0.0.1:4175
      BCRYPT_COST: '10'
      ACCESS_TOKEN_TTL_MINUTES: '15'
      REFRESH_TOKEN_TTL_DAYS: '7'
      REDIS_URL: redis://localhost:6379
      PUBLIC_API_URL: http://127.0.0.1:4000
      CUSTOMER_APP_URL: http://127.0.0.1:4173
      DRIVER_APP_URL: http://127.0.0.1:4174
      OPS_APP_URL: http://127.0.0.1:4175
      E2E_API_URL: http://127.0.0.1:4000
      E2E_CUSTOMER_EMAIL: customer@demo.dripless.local
      E2E_CUSTOMER_PASSWORD: DemoPass123!
      E2E_DRIVER_EMAIL: driver@demo.dripless.local
      E2E_DRIVER_PASSWORD: DemoPass123!
      E2E_OPS_EMAIL: ops@demo.dripless.local
      E2E_OPS_PASSWORD: DemoPass123!
      CUSTOMER_URL: http://127.0.0.1:4173
      DRIVER_URL: http://127.0.0.1:4174
      OPS_URL: http://127.0.0.1:4175
      E2E_GEOLOCATION: '1'
      VITE_API_BASE_URL: http://127.0.0.1:4000
      VITE_USE_MOCK_API: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend-api/package-lock.json
            Dripless Customer/package-lock.json
            Dripless Driver/package-lock.json
            Dripless Ops Admin/package-lock.json

      - name: Install backend + seed demo actors
        working-directory: backend-api
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:generate
          npm run db:seed

      - name: Start API
        working-directory: backend-api
        run: |
          npx tsx src/index.ts > /tmp/dripless-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          cat /tmp/dripless-api.log >&2
          exit 1

      - name: Build three apps
        run: |
          npm --prefix "Dripless Customer" ci
          npm --prefix "Dripless Driver" ci
          npm --prefix "Dripless Ops Admin" ci
          npm --prefix "Dripless Customer" run build
          npm --prefix "Dripless Driver" run build
          npm --prefix "Dripless Ops Admin" run build

      - name: Serve three apps
        run: |
          npx --yes serve -s -l 4173 "Dripless Customer/dist" > /tmp/serve-customer.log 2>&1 &
          npx --yes serve -s -l 4174 "Dripless Driver/dist" > /tmp/serve-driver.log 2>&1 &
          npx --yes serve -s -l 4175 "Dripless Ops Admin/dist" > /tmp/serve-ops.log 2>&1 &
          sleep 3

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run three-app Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-report
          path: e2e-report/
          if-no-files-found: ignore

  backup-restore-drill:
    name: backup-restore-drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dripless_backup_src
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dripless_backup_src
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_COST: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Migrate source DB
        working-directory: backend-api
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Dump → restore into isolated drill DB → verify migrations
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE DATABASE dripless_restore_drill;"
          pg_dump -h localhost -U postgres -d dripless_backup_src --format=custom --file=drill.dump
          pg_restore --clean --if-exists --no-owner --no-acl \
            -h localhost -U postgres -d dripless_restore_drill drill.dump
          cd backend-api
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dripless_restore_drill \
            npx prisma migrate status

  evidence-s3:
    name: evidence-s3
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused
      CORS_ORIGINS: http://localhost:5173
      BCRYPT_COST: '10'
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: dripless-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Start private MinIO object store
        run: |
          set -euo pipefail
          docker run -d --name dripless-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          docker logs dripless-minio || true
          exit 1

      - name: Create private evidence bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://dripless-evidence
          # MinIO buckets are private by default (no anonymous policy).
          aws --endpoint-url http://127.0.0.1:9000 s3api get-bucket-policy --bucket dripless-evidence 2>/dev/null \
            && echo "Unexpected public policy" && exit 1 \
            || echo "Bucket has no public policy (private)"

      - name: Install backend and run private S3 evidence test
        working-directory: backend-api
        run: |
          npm ci
          npm test -- src/evidence/s3-integration.test.ts src/evidence/storage.test.ts

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run npm audit (backend)
        working-directory: backend-api
        run: npm audit --audit-level=high --omit=dev

      - name: Run npm audit (customer)
        working-directory: Dripless Customer
        run: npm audit --audit-level=high --omit=dev

      - name: Run npm audit (driver)
        working-directory: Dripless Driver
        run: npm audit --audit-level=high --omit=dev

      - name: Run npm audit (ops)
        working-directory: Dripless Ops Admin
        run: npm audit --audit-level=high --omit=dev

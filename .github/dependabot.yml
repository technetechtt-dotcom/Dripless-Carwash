version: 2
updates:
  - package-ecosystem: npm
    directory: /backend-api
    schedule: { interval: weekly }
    groups:
      backend-dependencies: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /Dripless Customer
    schedule: { interval: weekly }
    groups:
      customer-dependencies: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /Dripless Driver
    schedule: { interval: weekly }
    groups:
      driver-dependencies: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /Dripless Ops Admin
    schedule: { interval: weekly }
    groups:
      ops-dependencies: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dripless
      POSTGRES_PASSWORD: dripless
      POSTGRES_DB: dripless
    ports:
      - "5432:5432"
    volumes:
      - dripless_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dripless"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend-api
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://dripless:dripless@postgres:5432/dripless
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      PAYMENTS_PROVIDER: stub
      PROCESS_ROLE: all
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  dripless_pg:

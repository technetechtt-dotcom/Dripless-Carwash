# Backend go-live on Render + existing Neon project "dripless wash"
# Dashboard → New → Blueprint → this file
# Region oregon matches Neon us-west-2.

services:
  - type: keyvalue
    name: dripless-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: dripless-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend-api
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    initialDeployHook: npx tsx prisma/seed.ts
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENV
        value: staging
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "4000"
      - key: PROCESS_ROLE
        value: all
      - key: PAYMENTS_PROVIDER
        value: stub
      - key: GEOCODER_PROVIDER
        value: none
      - key: ROUTING_PROVIDER
        value: none
      - key: EVIDENCE_STORAGE_PROVIDER
        value: local
      - key: MFA_REQUIRED_OPS
        value: "false"
      - key: MFA_ENC_KEY
        generateValue: true
      - key: COMPLETION_PIN_PEPPER
        generateValue: true
      # Paste Neon pooled URL (see backend-api/.env.neon locally)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: dripless-redis
          type: keyvalue
          property: connectionString
      # Defaults so API boots; update after frontends go live
      - key: PUBLIC_API_URL
        value: https://dripless-api.onrender.com
      - key: CUSTOMER_APP_URL
        value: http://localhost:5173
      - key: DRIVER_APP_URL
        value: http://localhost:5174
      - key: OPS_APP_URL
        value: http://localhost:5175
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5174,http://localhost:5175
      - key: WEBAUTHN_RP_ID
        value: localhost
      - key: WEBAUTHN_ORIGIN
        value: http://localhost:5175

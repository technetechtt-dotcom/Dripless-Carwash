# Dripless — Render Blueprint (Neon Postgres + Render Redis + API + static apps)
# Neon is external: paste the Neon pooled DATABASE_URL when Render prompts for it.
# Docs: docs/RENDER_NEON.md
#
# Create: Dashboard → New → Blueprint → connect this repo → select render.yaml

services:
  # ── Redis (rate limits, jobs, locks) ───────────────────────────────────────
  - type: keyvalue
    name: dripless-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only Render private network

  # ── API (+ in-process worker via PROCESS_ROLE=all for free staging) ────────
  - type: web
    name: dripless-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend-api
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    # Seeds demo users once on first successful deploy (DemoPass123!)
    initialDeployHook: npx tsx prisma/seed.ts
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENV
        value: staging
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "4000"
      - key: PROCESS_ROLE
        value: all
      - key: PAYMENTS_PROVIDER
        value: stub
      - key: GEOCODER_PROVIDER
        value: none
      - key: ROUTING_PROVIDER
        value: none
      - key: EVIDENCE_STORAGE_PROVIDER
        value: local
      - key: MFA_REQUIRED_OPS
        value: "false"
      - key: MFA_ENC_KEY
        generateValue: true
      - key: COMPLETION_PIN_PEPPER
        generateValue: true
      # Neon connection string (Dashboard → Connection details → pooled + sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: dripless-redis
          type: keyvalue
          property: connectionString
      # Set after first deploy to the real onrender.com URLs (see docs/RENDER_NEON.md)
      - key: PUBLIC_API_URL
        sync: false
      - key: CUSTOMER_APP_URL
        sync: false
      - key: DRIVER_APP_URL
        sync: false
      - key: OPS_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false

  # ── Customer SPA ───────────────────────────────────────────────────────────
  - type: web
    name: dripless-customer
    runtime: static
    rootDir: Dripless Customer
    buildCommand: npm ci --legacy-peer-deps && VITE_API_BASE_URL="https://${VITE_API_HOST}" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          name: dripless-api
          type: web
          property: host

  # ── Driver SPA ─────────────────────────────────────────────────────────────
  - type: web
    name: dripless-driver
    runtime: static
    rootDir: Dripless Driver
    buildCommand: npm ci --legacy-peer-deps && VITE_API_BASE_URL="https://${VITE_API_HOST}" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          name: dripless-api
          type: web
          property: host

  # ── Ops Admin SPA ──────────────────────────────────────────────────────────
  - type: web
    name: dripless-ops
    runtime: static
    rootDir: Dripless Ops Admin
    buildCommand: npm ci --legacy-peer-deps && VITE_API_BASE_URL="https://${VITE_API_HOST}" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          name: dripless-api
          type: web
          property: host
